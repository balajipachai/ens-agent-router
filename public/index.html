<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENS Agent Router</title>
<style>
  :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#deded8; --accent:#2f5d50; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#ececE6; --muted:#9a9a93; --card:#1f201e; --line:#34352f; --accent:#7fc4ae; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  textarea { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  button { margin-top:12px; padding:10px 18px; font:inherit; font-weight:600; background:var(--accent); color:var(--bg); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .card { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .badge { display:inline-block; padding:2px 10px; border:1px solid var(--accent); color:var(--accent); border-radius:999px; font-size:.85rem; font-weight:700; }
  .answer { white-space:pre-wrap; margin-top:10px; }
  .meta { color:var(--muted); font-size:.9rem; }
  .err { color:#c0392b; }
  ul { padding-left:20px; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Which AI should answer this?</h1>
  <p class="sub" id="status">One front door. The right helper answers, and you can see who it was.</p>
  <textarea id="q" rows="3" maxlength="1000" placeholder="Where do we stand on the overdue invoice from March?"></textarea>
  <button id="go">Ask</button>
  <div id="out"></div>
  <details class="card"><summary>Helpers discovered from ENS</summary><ul id="agents"></ul></details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
fetch("/api/agents").then((r) => r.json()).then((d) => {
  if (!d.agents) return;
  $("agents").replaceChildren(...d.agents.map((a) => el("li", {}, `${a.name}: ${a.description}`)));
}).catch(() => {});

$("go").addEventListener("click", async () => {
  const btn = $("go");
  btn.disabled = true;
  out.replaceChildren(el("p", { class: "sub" }, "Finding the right helper…"));
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ question: $("q").value }),
    });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (d.status === "no-agent") {
      out.replaceChildren(el("div", { class: "card" }, d.message));
    } else if (d.status === "agent-error") {
      out.replaceChildren(el("div", { class: "card" }, el("span", { class: "badge" }, d.agent.name), el("p", { class: "err" }, d.message)));
    } else {
      out.replaceChildren(el("div", { class: "card" },
        el("span", { class: "badge" }, `Answered by ${d.agent.name}`),
        el("div", { class: "meta" }, d.reason || d.agent.description),
        el("div", { class: "answer" }, d.answer)));
    }
  } catch (e) {
    out.replaceChildren(el("p", { class: "err" }, e.message));
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
